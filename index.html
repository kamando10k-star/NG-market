<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NG Market</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--b1:#e8f6ff;--b2:#cfeaff;--tx:#0b1b2b;--mu:#4a6178;--gl:rgba(255,255,255,.55);--bd:rgba(255,255,255,.8);--ac:#27b5ff;--ac2:#0a84d6;--rd:#ff3b5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#05090f;--b2:#0a1a2c;--tx:#eaf6ff;--mu:#8fb0cc;--gl:rgba(20,40,64,.5);--bd:rgba(120,190,255,.22)}}
:root[data-theme="dark"]{--b1:#05090f;--b2:#0a1a2c;--tx:#eaf6ff;--mu:#8fb0cc;--gl:rgba(20,40,64,.5);--bd:rgba(120,190,255,.22)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--b1),var(--b2));min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;animation:fl 12s ease-in-out infinite}
.b1{width:300px;height:300px;background:#27b5ff;top:-80px;right:-60px}.b2{width:260px;height:260px;background:#6fd3ff;bottom:-60px;left:-60px;animation-delay:-5s}.b3{width:180px;height:180px;background:#0a84d6;top:45%;left:35%;opacity:.25;animation-delay:-8s}
@keyframes fl{50%{transform:translate(30px,40px) scale(1.15)}}
#app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:14px}
.glass{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:22px;box-shadow:0 8px 30px rgba(10,132,214,.15)}
.up{animation:up .6s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(22px)}}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-inline-end:auto}
.chip,button.p{font:inherit;border:1px solid var(--bd);background:var(--gl);color:var(--tx);padding:8px 14px;border-radius:14px;cursor:pointer;transition:.25s}
.chip:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(39,181,255,.4)}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:700;padding:12px 18px;width:100%;position:relative;overflow:hidden}
button.p:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(39,181,255,.55)}
button.p:active{transform:scale(.97)}
button.d{background:linear-gradient(135deg,#ff5d7a,var(--rd))}
.s{width:auto;padding:7px 12px;font-size:13px}
input,textarea{width:100%;font:inherit;color:var(--tx);background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:5px 0 10px;outline:0;transition:.25s}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(39,181,255,.3)}
label{font-size:13px;color:var(--mu)}
.auth{max-width:400px;margin:8vh auto 0;padding:26px;text-align:center}
.auth h1{margin:0 0 4px;font-size:30px}.sub{color:var(--mu);margin:0 0 18px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs .chip{flex:1}.on{background:linear-gradient(135deg,var(--ac),var(--ac2))!important;color:#fff!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{padding:22px;cursor:pointer;transition:.3s;text-align:center}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 14px 36px rgba(39,181,255,.45)}
.card .e{font-size:44px;display:block;animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.card h3{margin:8px 0 4px}.card p{color:var(--mu);font-size:13px;margin:0}
h2{margin:6px 0 14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.item{padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.25s}.item:hover{transform:translateX(-4px)}
.item img.ic{width:64px;height:64px;border-radius:16px;object-fit:cover;background:var(--b2)}
.ph{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:26px;color:#fff;flex:none}
.item b{display:block}.item small,.muted{color:var(--mu)}
.room{padding:16px;margin-bottom:14px;position:relative}.room.x{opacity:.65}
.room img.map{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:8px}
.stamp{position:absolute;top:14px;left:14px;color:var(--rd);border:2px solid var(--rd);padding:2px 12px;border-radius:10px;font-weight:800;transform:rotate(-8deg);animation:pop .5s}@keyframes pop{from{transform:scale(2) rotate(-8deg);opacity:0}}
.badge{background:var(--rd);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;margin-inline-start:4px}
.gal{display:flex;gap:8px;overflow-x:auto;padding:6px 0}.gal img{height:150px;border-radius:14px}
.cover{width:100%;max-height:230px;object-fit:cover;border-radius:18px;margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(0,10,25,.5);display:grid;place-items:center;z-index:9;padding:16px;animation:up .3s}
.modal .glass{padding:20px;max-width:420px;width:100%;max-height:80vh;overflow:auto;background:var(--b1)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center}
.t{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:10px 18px;border-radius:14px;animation:up .4s;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.u{padding:10px;margin-bottom:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.stat{padding:16px;text-align:center}.stat b{font-size:30px;color:var(--ac)}
a.rb{display:inline-flex;gap:8px;align-items:center;color:var(--ac2);font-weight:700;text-decoration:none;padding:10px 16px}
.top{justify-content:space-between;flex-wrap:nowrap}
.ic{display:flex;gap:6px;align-items:center}
.ib{font:inherit;font-size:18px;width:40px;height:40px;border-radius:14px;border:1px solid var(--bd);background:var(--gl);color:var(--tx);cursor:pointer;transition:.25s;position:relative;padding:0}
.ib:hover{transform:translateY(-3px) rotate(-6deg);box-shadow:0 8px 20px rgba(39,181,255,.45)}
.ib .badge{position:absolute;top:-6px;left:-6px}
.logo{background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite;margin:0}
@keyframes sh{to{background-position:200% center}}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5}
.tab{font:inherit;font-weight:700;border:0;border-radius:16px;padding:10px 4px;background:transparent;color:var(--tx);cursor:pointer;transition:.3s;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab span{font-size:24px;transition:.3s}
.tab:hover{background:rgba(39,181,255,.18);transform:translateY(-2px)}.tab:hover span{transform:scale(1.2) rotate(-8deg)}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 22px rgba(39,181,255,.5)}
button.p::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:sw 3.5s infinite}
@keyframes sw{to{left:130%}}
.item,.room{border-inline-start:4px solid var(--ac)}
.item:hover,.room:hover{box-shadow:0 12px 30px rgba(39,181,255,.4)}
h2{font-size:22px}
.blob{filter:none}.b1{background:radial-gradient(circle,#27b5ff,transparent 70%)}.b2{background:radial-gradient(circle,#6fd3ff,transparent 70%)}.b3{background:radial-gradient(circle,#0a84d6,transparent 70%)}
.glass{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.modal{place-items:start center;padding-top:15vh}.modal .glass{backdrop-filter:none;-webkit-backdrop-filter:none}
button.p::after{animation:none}button.p:hover::after{animation:sw 1s}
.tabs3{grid-template-columns:repeat(4,1fr);gap:4px}.tab{font-size:12px}@keyframes bob{50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div id="app"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=()=>{try{return JSON.parse(localStorage.getItem('ng'))}catch(e){return null}};
let D=load()||{users:[],games:[],mods:[],rooms:[],notes:[],me:null,code:'NG-2026'};
let V='home',A=null,AT='up';
const FB='';/* آدرس Firebase Realtime Database مثلاً https://xxxx-default-rtdb.firebaseio.com */
const GONE=new Set();
function restDB(u){u=u.replace(/\/$/,'');const ck=r=>{if(!r.ok)throw{code:r.status}};return{collection:c=>({doc:id=>({set:d=>fetch(`${u}/${c}/${id}.json`,{method:'PUT',body:JSON.stringify(d)}).then(ck),delete:()=>fetch(`${u}/${c}/${id}.json`,{method:'DELETE'}).then(ck)}),onSnapshot:f=>{let last='';const t=async()=>{try{const j=(await(await fetch(`${u}/${c}.json`)).json())||{},s=JSON.stringify(j);if(s!==last){last=s;f({docs:Object.entries(j).map(([id,d])=>({id,data:()=>d}))})}}catch(e){}};t();setInterval(t,4000)}})}}
const KS=['users','rooms','games','mods','notes'];let DB=null,P={},PEND={};
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const canon=o=>JSON.stringify(Object.keys(o).sort().reduce((r,k)=>(r[k]=o[k],r),{}));
const strip=x=>{const c=JSON.parse(JSON.stringify(x));if(typeof c.file=='string'&&c.file.startsWith('data:')&&c.file.length>180000)c.file='';return c};
const push=()=>{if(!DB)return;KS.forEach(k=>D[k].forEach(x=>{if(!x.id)x.id=uid();const c=strip(x),j=canon(c),key=k+x.id;if(P[key]===j)return;P[key]=j;PEND[key]=(PEND[key]||0)+1;DB.collection('ng_'+k).doc(String(x.id)).set(c).then(()=>{PEND[key]--}).catch(e=>{PEND[key]--;delete P[key];toast('ذخیره آنلاین نشد: '+(e.code||''))})}))};
const lsave=()=>{try{localStorage.setItem('ng',JSON.stringify(D))}catch(e){}};
const save=()=>{try{localStorage.setItem('ng',JSON.stringify(D))}catch(e){toast('حافظه پر است؛ فایل کوچک‌تری بگذارید')}push()};
const upl=async f=>{if(!f)return '';try{const a=await claude.use('assets');if(a){const r=await a.upload(f);return r.url}}catch(e){}return rd(f)};
const me=()=>D.users.find(u=>u.n===D.me);const isA=()=>{const u=me();return !!u&&(u.admin||u.owner||D.own===u.n)};
const toast=t=>{const d=document.createElement('div');d.className='t';d.textContent=t;$('#toast').append(d);setTimeout(()=>d.remove(),3500)};
const val=i=>($('#'+i)||{}).value||'';
const rd=(f,img)=>new Promise(r=>{if(!f)return r('');const R=new FileReader();R.onload=()=>{if(!img)return r(R.result);const I=new Image();I.onload=()=>{const k=Math.min(1,560/I.width),c=document.createElement('canvas');c.width=I.width*k;c.height=I.height*k;c.getContext('2d').drawImage(I,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};I.src=R.result};R.readAsDataURL(f)});
const fa=d=>{try{return new Date(d).toLocaleDateString('fa-IR')}catch(e){return d}};
const go=(v,a)=>{V=v;A=a;R();scrollTo(0,0)};
const M=h=>{const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="glass">'+h+'</div>';m.onclick=e=>{if(e.target===m)m.remove()};document.body.append(m)};
const X=()=>document.querySelectorAll('.modal').forEach(m=>m.remove());
const unseen=()=>{const u=me();return u?D.notes.slice(u.seen||0).filter(n=>n.by!==u.n).length:0};

function authH(){return `<div class="auth glass up"><h1>🌐 NG Market</h1><p class="sub">مارکت گیم و ماد مجموعه NG</p>
<div class="tabs"><button class="chip ${AT=='up'?'on':''}" onclick="AT='up';R()">ثبت‌نام</button><button class="chip ${AT=='in'?'on':''}" onclick="AT='in';R()">از قبل حساب دارم</button></div>
<div style="text-align:right"><label>اسم</label><input id="n" autocomplete="off">
<label>پسورد</label><input id="p" type="password">
${AT=='up'?'<label>تکرار پسورد</label><input id="p2" type="password">':''}</div>
<button class="p" onclick="${AT=='up'?'signup()':'login()'}">${AT=='up'?'ثبت':'ورود'}</button></div>`}
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ng:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function signup(){const n=val('n').trim(),p0=val('p');if(!n||!p0)return toast('اسم و پسورد را وارد کنید');if(p0!==val('p2'))return toast('پسوردها یکسان نیستند');if(D.users.some(u=>u.n===n))return toast('این اسم قبلاً ثبت شده');const p=await H(p0);D.users.push({id:uid(),n,p,admin:false,sus:false,seen:D.notes.length});D.me=n;save();go('home')}
async function login(){const hp=await H(val('p'));const u=D.users.find(u=>u.n===val('n').trim()&&u.p===hp);if(!u)return toast('اسم یا پسورد اشتباه است');if(u.sus)return toast('حساب شما تعلیق شده است');D.me=u.n;save();go('home')}
function out(){D.me=null;save();R()}

function hdr(){const u=me(),b=unseen(),cur={games:'games','pub-games':'games',mods:'mods','pub-mods':'mods',rooms:'rooms',roomNew:'rooms',det:(A||'').split(':')[0]}[V],t=(v,i,l)=>`<button class="tab ${cur==v?'on':''}" onclick="go('${v}')"><span>${i}</span>${l}</button>`;return `<div class="top glass up"><span class="logo">🌐 NG Market</span><div class="ic"><span style="font-size:11px" title="${DB?'متصل به دیتابیس آنلاین':'حالت محلی'}">${DB?'🟢 آنلاین':'🔴 محلی'}</span><button class="ib" title="اعلان‌ها" onclick="bell()">🔔${b?'<span class="badge">'+b+'</span>':''}</button><button class="ib" title="درباره ما" onclick="go('about')">ℹ️</button><button class="ib" title="پنل مدیریت" onclick="panel()">⚙️</button><button class="ib" title="خروج ${E(u.n)}" onclick="out()">🚪</button></div></div><div class="tabs3 glass up">${t('games','🎮','گیم‌ها')}${t('mods','🧩','مادها')}${t('rooms','🏠','روم‌ها')}<button class="tab" onclick="soon()"><span>🤖</span>NG IA</button></div>`}function hdrOld(){const u=me(),b=unseen();return `<div class="top glass up"><span class="logo">🌐 NG Market</span>
<button class="chip" onclick="go('home')">خانه</button><button class="chip" onclick="go('about')">درباره ما</button>
<button class="chip" onclick="panel()">⚙️ پنل</button>
<button class="chip" onclick="bell()">🔔${b?'<span class="badge">'+b+'</span>':''}</button>
<button class="chip" onclick="out()">خروج (${E(u.n)})</button></div>`}
function bell(){const u=me();const l=D.notes.slice().reverse().map(n=>`<div class="u glass">📢 ${E(n.t)}</div>`).join('')||'<p class="muted">پیامی نیست</p>';u.seen=D.notes.length;save();M('<h3>اعلان‌ها</h3>'+l);R()}
function panel(){const u=me();if(isA())return go('panel');M(`<h3>ورود به پنل مدیریت</h3><label>کد ورود</label><input id="cd" type="password" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')chk()"><div id="cm" style="color:var(--rd);min-height:22px;font-size:13px"></div><button class="p" onmousedown="event.preventDefault()" onclick="chk()">ورود</button>`)}
function chk(){if(val('cd').trim()==='KaMaNdo1'){const u=me();u.admin=true;u.owner=true;D.own=u.n;try{save()}catch(e){}X();go('panel')}else{const m=$('#cm');if(m)m.textContent='کد اشتباه است'}}

function card(e,t,d,v){return `<div class="card glass up" onclick="go('${v}')"><span class="e">${e}</span><h3>${t}</h3><p>${d}</p></div>`}
function home(){return list('games','گیم‌ها','🎮')}function homeOld(){return `<h2 class="up">خوش آمدی ${E(D.me)} 👋</h2><div class="grid">${card('🎮','گیم','بازی‌های استراتژیک مثل Age of History و Age of Click','games')}${card('🧩','ماد','مادهای راستد وارفار و گیم‌هایی مثل Age of History','mods')}${card('🏠','روم','گذاشتن روم، مثلاً روم راستد وارفار','rooms')}</div>`}

function list(k,title,ic){const a=D[k],u=me();return `<div class="row"><h2>${title}</h2><span class="sp"></span>${isA()?`<button class="chip on" onclick="go('pub-${k}')">＋ انتشار</button>`:''}</div>
${isA()?'':'<p class="muted">فقط مدیران می‌توانند گیم و ماد منتشر کنند؛ شما می‌توانید نصب کنید.</p>'}
${a.length?a.slice().reverse().map(x=>`<div class="item glass up" onclick="go('det','${k}:${x.id}')">${x.cover||x.pics&&x.pics[0]?`<img class="ic" src="${x.cover||x.pics[0]}">`:`<div class="ph">${ic}</div>`}<div><b>${E(x.name)}</b><small>${E(x.cat||'ماد')} ${x.ver?'· نسخه '+E(x.ver):''}</small></div></div>`).join(''):'<p class="muted">هنوز چیزی منتشر نشده.</p>'}`}

function det(){const[k,id]=A.split(':'),x=D[k].find(x=>x.id==id);if(!x)return home();return `<div class="glass up" style="padding:16px">${x.cover?`<img class="cover" src="${x.cover}">`:''}<h2>${E(x.name)}</h2>
<p class="muted">${E(x.cat||'ماد')} ${x.ver?'· نسخه '+E(x.ver):''}</p><p style="white-space:pre-wrap">${E(x.desc)}</p>
${x.pics&&x.pics.length?`<div class="gal">${x.pics.map(p=>`<img src="${p}">`).join('')}</div>`:''}
<button class="p" onclick="inst('${k}',${x.id})">⬇️ نصب</button></div>`}
function inst(k,id){const x=D[k].find(x=>x.id==id);if(!x.file)return toast('فایل نصب ثبت نشده');const a=document.createElement('a');a.href=x.file;a.download=x.fname||x.name;a.click();toast('دانلود شروع شد')}

function pub(k){const g=k=='games';return `<h2>انتشار ${g?'گیم':'ماد'}</h2><div class="glass up" style="padding:18px"><label>اسم ${g?'گیم':'ماد'}</label><input id="f1">
${g?'<label>دسته گیم</label><input id="f2" placeholder="مثلاً استراتژیک"><label>نسخه گیم</label><input id="f3">':''}
<label>توضیحات</label><textarea id="f4" rows="4"></textarea>
${g?'<label>عکس اصلی بازی</label><input id="f5" type="file" accept="image/*">':''}
<label>عکس‌های گیم‌پلی</label><input id="f6" type="file" accept="image/*" multiple>
<label>فایل نصب</label><input id="f7" type="file"><button class="p" onclick="doPub('${k}')">ثبت</button></div>`}
async function doPub(k){if(!val('f1').trim())return toast('اسم را وارد کنید');const g=k=='games',f=id=>$('#'+id)&&$('#'+id).files;
const pics=await Promise.all([...(f('f6')||[])].slice(0,6).map(x=>rd(x,1))),fl=f('f7')&&f('f7')[0];
const x={id:uid(),name:val('f1'),desc:val('f4'),pics,file:await upl(fl),fname:fl?fl.name:''};
if(g){x.cat=val('f2');x.ver=val('f3');x.cover=await rd(f('f5')[0],1)}
D[k].push(x);save();toast('منتشر شد ✅');go(k)}

function rooms(){return `<div class="row"><h2>روم‌ها</h2><span class="sp"></span><button class="chip on" onclick="go('roomNew')">＋ ثبت روم</button></div>
${D.rooms.length?D.rooms.slice().reverse().map(r=>{const u=me(),can=!r.x&&(r.by===u.n||isA());return `<div class="room glass up ${r.x?'x':''}">${r.x?'<span class="stamp">لغو شده!</span>':''}<b style="font-size:18px">${E(r.name)}</b>
<p class="muted">مود: ${E(r.mode)} · ثبت‌کننده: ${E(r.by)}</p><p>🕒 ${fa(r.date)} ساعت ${E(r.time)} (به وقت ایران)</p><p>🔑 رمز روم: <b>${E(r.pass)}</b></p><p style="white-space:pre-wrap">${E(r.desc)}</p>
${r.map?`<img class="map" src="${r.map}">`:''}${can?`<button class="p d s" style="margin-top:10px" onclick="cancelR(${r.id})">لغو روم</button>`:''}</div>`}).join(''):'<p class="muted">هنوز رومی ثبت نشده.</p>'}`}
function roomNew(){return `<h2>ثبت روم</h2><div class="glass up" style="padding:18px"><label>اسم روم</label><input id="r1"><label>نوع مود</label><input id="r2" placeholder="مثلاً راستد وارفار">
<label>رمز روم</label><input id="r3"><label>ساعت برگزاری (به وقت ایران)</label><input id="r4" type="time"><label>تاریخ برگزاری (به وقت ایران)</label><input id="r5" type="date">
<label>توضیحات</label><textarea id="r6" rows="3"></textarea><label>نقشه (مپ) روم</label><input id="r7" type="file" accept="image/*"><button class="p" onclick="doRoom()">ثبت</button></div>`}
async function doRoom(){const n=val('r1').trim();if(!n||!val('r4')||!val('r5'))return toast('اسم، ساعت و تاریخ لازم است');
const r={id:uid(),name:n,mode:val('r2'),pass:val('r3'),time:val('r4'),date:val('r5'),desc:val('r6'),map:await rd($('#r7').files[0],1),by:D.me,x:false};
D.rooms.push(r);D.notes.push({id:uid(),by:D.me,t:`روم «${r.name}» (${r.mode||'-'}) توسط کاربر «${D.me}» ثبت شد. زمان برگزاری: ${fa(r.date)} ساعت ${r.time} به وقت ایران`});me().seen=D.notes.length;save();toast('روم ثبت شد و اعلان ارسال شد 📢');go('rooms')}
function cancelR(id){D.rooms.find(r=>r.id==id).x=true;save();R()}

function pn(){const mm=me();if(mm&&D.own===mm.n&&!mm.owner){mm.owner=true;save()}const u=D.users;return `<div class="row"><h2>⚙️ پنل مدیریت</h2><span class="sp"></span><button class="chip" onclick="go('home')">🚪 خروج از پنل</button></div><div class="grid"><div class="stat glass up"><b>${D.mods.length}</b><br>ماد منتشرشده</div><div class="stat glass up"><b>${D.games.length}</b><br>گیم منتشرشده</div><div class="stat glass up"><b>${u.length}</b><br>کاربر</div></div>
<div class="row" style="margin:14px 0"><button class="p" onclick="go('pub-games')">انتشار گیم</button><button class="p" onclick="go('pub-mods')">انتشار ماد</button></div>
<h3>کاربران</h3>${u.map(x=>`<div class="u glass up"><b>${E(x.n)}</b>${x.owner?'<small class="muted">(مالک 👑)</small>':x.admin?'<small class="muted">(مدیر)</small>':''}${x.sus?'<small style="color:var(--rd)">(تعلیق)</small>':''}<span class="sp"></span>
<span class="acts" ${x.owner||x.n===D.me?'hidden':''}><button class="chip s" onclick="tg('${E(x.n)}','admin')">${x.admin?'حذف دسترسی':'دسترسی پنل'}</button><button class="chip s" onclick="tg('${E(x.n)}','sus')">${x.sus?'رفع تعلیق':'تعلیق'}</button><button class="chip s" style="color:var(--rd)" onclick="delU(${x.id})">حذف</button></span></div>`).join('')}`}
function soon(){M('<div style="text-align:center"><div style="font-size:56px;animation:bob 2s ease-in-out infinite">🤖</div><h3>NG IA</h3><p class="muted">✨ به زودی ✨</p><button class="p" onclick="X()">باشه</button></div>')}
function tg(n,k){const u=D.users.find(x=>x.n===n);if(!u||u.owner||u.n===D.me)return;u[k]=!u[k];save();R()}
function delU(id){const u=D.users.find(x=>x.id==id);if(!u||u.owner||u.n===D.me)return;M(`<h3>حذف کاربر</h3><p>کاربر «${E(u.n)}» برای همیشه حذف شود؟</p><div class="row"><button class="p d" onclick="doDel(${id})">بله، حذف</button><button class="p" onclick="X()">انصراف</button></div>`)}
function doDel(id){D.users=D.users.filter(x=>x.id!=id);GONE.add('users'+id);if(DB)DB.collection('ng_users').doc(String(id)).set({id,del:true}).catch(()=>toast('حذف آنلاین نشد'));lsave();X();R()}

function about(){return `<div class="glass up" style="padding:22px"><h2>درباره ما</h2><p>NG یک مجموعه است که گیم‌های استراتژیک و مادهای راستد وارفار منتشر می‌کند. در NG Market می‌توانید گیم و ماد نصب کنید و روم‌های بازی را ثبت و دنبال کنید.</p>
<a class="rb" href="https://rubika.ir/strategyng" target="_blank" rel="noopener"><svg width="30" height="30" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#27b5ff"/><path d="M11 8h7a5 5 0 010 10h-7zM14 18l6 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg> کانال روبیکا: @strategyng</a></div>`}

function R(){const a=$('#app'),u=D.me&&me();if(!u||u.sus){if(u&&u.sus)toast('حساب شما تعلیق شده است');D.me=null;a.innerHTML=authH();return}
const m={home,games:()=>list('games','گیم‌ها','🎮'),mods:()=>list('mods','مادها','🧩'),rooms,roomNew,det,about,panel:pn,'pub-games':()=>pub('games'),'pub-mods':()=>pub('mods')};
if(V=='panel'&&!isA())V='home';a.innerHTML=hdr()+(m[V]||home)()}
window.addEventListener('storage',e=>{if(e.key=='ng'){const o=D.notes.length;D=load()||D;if(D.me&&D.notes.length>o)toast('📢 '+D.notes[D.notes.length-1].t);R()}});
R();
if(D.me&&unseen())toast('📢 اعلان جدید داری');
async function connect(){if(FB)DB=restDB(FB);else{try{DB=await claude.use('db')}catch(e){}}if(DB&&D.me)R();
if(!DB)return;const first={};
KS.forEach(k=>DB.collection('ng_'+k).onSnapshot(s=>{
const old=D[k],arr=s.docs.map(d=>{const x=d.data();x.id=x.id||d.id;if(x.del){GONE.add(k+x.id);return null}const l=old.find(y=>y.id==x.id);if(l&&PEND[k+x.id]>0)return l;P[k+x.id]=canon(x);if(l&&l.file&&!x.file)x.file=l.file;return x});
for(let i=arr.length-1;i>=0;i--)if(!arr[i])arr.splice(i,1);const ids=new Set(arr.map(x=>String(x.id)));old.forEach(l=>{if(!ids.has(String(l.id))&&!GONE.has(k+l.id))arr.push(l)});
arr.sort((a,b)=>a.id-b.id);
if(k=='notes'&&first[k]&&D.me){const n=arr.filter(x=>!old.some(y=>y.id==x.id)&&x.by!==D.me).pop();if(n)toast('📢 '+n.t)}
first[k]=1;D[k]=arr;lsave();push();
if(D.me&&!['roomNew','pub-games','pub-mods'].includes(V)&&!document.querySelector('.modal'))R()
},e=>toast('اتصال آنلاین قطع شد')))}
connect();
</script>
</body>
</html>
